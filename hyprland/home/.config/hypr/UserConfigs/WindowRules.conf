# =====================================================
# Hyprland Window Rules (v0.53.3+)
# =====================================================

########################
# TAG DEFINITIONS
########################

# Browsers
windowrule = tag browser, match:class = ^([Ff]irefox|org\.mozilla\.firefox|[Ff]irefox-esr|[Ff]irefox-bin)$
windowrule = tag browser, match:class = ^([Gg]oogle-chrome(-beta|-dev|-unstable)?)$
windowrule = tag browser, match:class = ^(chrome-.+-Default)$
windowrule = tag browser, match:class = ^([Cc]hromium)$
windowrule = tag browser, match:class = ^([Mm]icrosoft-edge(-stable|-beta|-dev|-unstable))$
windowrule = tag browser, match:class = ^(Brave-browser(-beta|-dev|-unstable)?)$
windowrule = tag browser, match:class = ^([Tt]horium-browser|[Cc]achy-browser)$
windowrule = tag browser, match:class = ^(zen-alpha|zen)$

# Notifications
windowrule = tag notif, match:class = ^(swaync-control-center|swaync-notification-window|swaync-client)$

# Terminals
windowrule = tag terminal, match:class = ^(Alacritty|kitty|kitty-dropterm)$

# Email
windowrule = tag email, match:class = ^([Tt]hunderbird|org\.gnome\.Evolution|eu\.betterbird\.Betterbird)$

# Projects / IDEs
windowrule = tag projects, match:class = ^(codium|codium-url-handler|VSCodium|VSCode|code-url-handler|jetbrains-.*)$

# Screen sharing
windowrule = tag screenshare, match:class = ^(com\.obsproject\.Studio)$

# IM / Chat
windowrule = tag im, match:class = ^(Discord|WebCord|Vesktop|Ferdium|whatsapp-for-linux|ZapZap|com\.rtosta\.zapzap|org\.telegram\.desktop|io\.github\.tdesktop_x64\.TDesktop|teams-for-linux|Element|im\.riot\.Riot)$

# Games
windowrule = tag games, match:class = ^(gamescope|steam_app_\d+)$

# Game stores
windowrule = tag gamestore, match:class = ^(Steam|com\.heroicgameslauncher\.hgl)$
windowrule = tag gamestore, match:title = ^(Lutris)$

# File managers
windowrule = tag file-manager, match:class = ^(Thunar|org\.gnome\.Nautilus|pcmanfm-qt|app\.drey\.Warp)$

# Wallpaper tools
windowrule = tag wallpaper, match:class = ^(Waytrogen)$

# Multimedia
windowrule = tag multimedia, match:class = ^(Audacious)$
windowrule = tag multimedia_video, match:class = ^(mpv|vlc)$

# Settings / Utilities
windowrule = tag settings, match:class = ^(pavucontrol|org\.pulseaudio\.pavucontrol|qt5ct|qt6ct|nm-applet|blueman-manager|file-roller|org\.gnome\.FileRoller|Rofi|gnome-disks|wihotspot(-gui)?)$

# Viewers
windowrule = tag viewer, match:class = ^(org\.gnome\.SystemMonitor|MissionCenter|evince|eog|org\.gnome\.Loupe)$


########################
# SPECIAL OVERRIDES
########################

windowrule = no_blur on, match:tag = multimedia_video
windowrule = opacity 1.0 override 1.0 override, match:tag = multimedia_video


########################
# WORKSPACE ROUTING
########################

windowrule = workspace 1, match:tag = email
windowrule = workspace 2, match:tag = browser
windowrule = workspace 5, match:tag = gamestore
windowrule = workspace 7, match:tag = im
windowrule = workspace 8, match:tag = games

windowrule = workspace 4 silent, match:tag = screenshare
windowrule = workspace 6 silent, match:class = ^(virt-manager|\.virt-manager-wrapped)$
windowrule = workspace 9 silent, match:tag = multimedia


########################
# FLOATING WINDOWS
########################

windowrule = float on, match:tag = settings
windowrule = float on, match:tag = viewer
windowrule = float on, match:tag = wallpaper

windowrule = float on, match:class = ^(Zoom|onedriver|onedriver-launcher)$
windowrule = float on, match:class = ^(mpv|com\.github\.rafostar\.Clapper)$
windowrule = float on, match:class = ^(Qalculate-gtk)$
windowrule = float on, match:class = ^(Ferdium)$

# Dialogs
windowrule = float on, match:title = ^(Authentication Required|Save As|Add Folder to Workspace|Open Files|SDDM Background)$


########################
# CENTERING & SIZING
########################

windowrule = center on, match:title = ^(Authentication Required|Save As|Add Folder to Workspace|Open Files|SDDM Background)$
windowrule = size 70% 60%, match:title = ^(Save As|Add Folder to Workspace|Open Files)$
windowrule = size 16% 12%, match:title = ^(SDDM Background)$


########################
# OPACITY
########################

windowrule = opacity 0.9 override 0.7 override, match:tag = browser
windowrule = opacity 0.9 override 0.8 override, match:tag = projects
windowrule = opacity 0.94 override 0.86 override, match:tag = im
windowrule = opacity 0.9 override 0.8 override, match:tag = file-manager
windowrule = opacity 0.8 override 0.7 override, match:tag = terminal
windowrule = opacity 0.8 override 0.7 override, match:tag = settings
windowrule = opacity 0.82 override 0.75 override, match:tag = viewer
windowrule = opacity 0.9 override 0.7 override, match:tag = wallpaper
windowrule = opacity 0.95 override 0.75 override, match:title = ^(Picture-in-Picture)$


########################
# PICTURE-IN-PICTURE
########################

windowrule = float on, match:title = ^(Picture-in-Picture)$
windowrule = pin on, match:title = ^(Picture-in-Picture)$
windowrule = keep_aspect_ratio on, match:title = ^(Picture-in-Picture)$
windowrule = move 72% 7%, match:title = ^(Picture-in-Picture)$


########################
# GAMES
########################

windowrule = fullscreen on, match:tag = games
windowrule = no_blur on, match:tag = games


########################
# FOCUS FIXES
########################

windowrule = no_initial_focus on, match:class = ^(jetbrains-.*)$
windowrule = no_initial_focus on, match:title = ^(wind.*)$


########################
# IDLE INHIBIT
########################

windowrule = idle_inhibit on, match:fullscreen = true
