# ╔══════════════════════════════════════════════════════════════════╗
# ║                      Kitty — TokyoNight                         ║
# ╚══════════════════════════════════════════════════════════════════╝

# ── Theme ─────────────────────────────────────────────────────────
include tokyonight_night.conf

# ── Font ──────────────────────────────────────────────────────────
font_family      RobotoMono Nerd Font
bold_font        RobotoMono Nerd Font Bold
italic_font      RobotoMono Nerd Font Italic
bold_italic_font RobotoMono Nerd Font Bold Italic
font_size        15.0
adjust_line_height 135%
disable_ligatures never

# ── Cursor ────────────────────────────────────────────────────────
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0
cursor #ff9e64

# ── Scrollback ────────────────────────────────────────────────────
scrollback_lines 100000
scrollback_pager bat --style=plain --paging=always
wheel_scroll_multiplier 3.0

# ── Mouse ─────────────────────────────────────────────────────────
mouse_hide_wait 2.0
copy_on_select clipboard
strip_trailing_spaces smart
click_interval 0.3
url_style curly

# ── Window ────────────────────────────────────────────────────────
window_padding_width 10 14
placement_strategy center
hide_window_decorations no
confirm_os_window_close 0
background_opacity 0.93
background_blur 20
remember_window_size yes
initial_window_width 120c
initial_window_height 35c

# ── Tab Bar ───────────────────────────────────────────────────────
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_title_template " {index}: {title} "
active_tab_font_style bold
inactive_tab_font_style normal

# ── Bell ──────────────────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.0
bell_on_tab "🔔 "

# ── macOS ─────────────────────────────────────────────────────────
macos_option_as_alt yes
macos_quit_when_last_window_closed yes
macos_show_window_title_in none
macos_titlebar_color background
macos_thicken_font 0.25

# ── Clipboard ────────────────────────────────────────────────────
clipboard_control write-clipboard write-primary read-clipboard

# ── Shell ─────────────────────────────────────────────────────────
shell /bin/zsh
editor nvim

# ── Keymaps ───────────────────────────────────────────────────────

# Tabs
map cmd+t new_tab_with_cwd
map cmd+w close_tab
map cmd+shift+] next_tab
map cmd+shift+[ previous_tab
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# Splits (windows in kitty terminology)
map cmd+d launch --cwd=current --location=vsplit
map cmd+shift+d launch --cwd=current --location=hsplit
map cmd+shift+enter new_os_window_with_cwd

# Split navigation
map cmd+opt+left neighboring_window left
map cmd+opt+right neighboring_window right
map cmd+opt+up neighboring_window up
map cmd+opt+down neighboring_window down

# Split resizing
map cmd+ctrl+left resize_window narrower 2
map cmd+ctrl+right resize_window wider 2
map cmd+ctrl+up resize_window taller 2
map cmd+ctrl+down resize_window shorter 2

# Zoom
map cmd+enter toggle_layout stack

# Font size
map cmd+plus change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0 change_font_size all 0

# Scrolling
map cmd+k clear_terminal to_cursor active
map cmd+up scroll_home
map cmd+down scroll_end

# Config
map cmd+shift+, load_config_file
