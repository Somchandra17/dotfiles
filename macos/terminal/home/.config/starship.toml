"$schema" = 'https://starship.rs/config-schema.json'

palette = "tokyonight"

format = """
$directory\
$git_branch\
$git_status\
$python\
$rust\
$golang\
$nodejs\
$java\
$docker_context\
$cmd_duration\
$fill\
$time\
$line_break\
$character"""

[fill]
symbol = ' '

[directory]
style = "bold fg:blue"
format = '[$path]($style)[$read_only]($read_only_style) '
read_only = " 󰌾"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Developer" = "󰲋 "
"Projects" = "󰲋 "

[git_branch]
symbol = " "
style = "fg:purple"
format = '[$symbol$branch]($style) '

[git_status]
style = "fg:red"
format = '[$all_status$ahead_behind]($style) '
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "=${count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
deleted = "✘${count}"

[python]
symbol = " "
style = "fg:yellow"
format = '[$symbol$version]($style) '

[rust]
symbol = " "
style = "fg:orange"
format = '[$symbol$version]($style) '

[golang]
symbol = " "
style = "fg:cyan"
format = '[$symbol$version]($style) '

[nodejs]
symbol = " "
style = "fg:green"
format = '[$symbol$version]($style) '

[java]
symbol = " "
style = "fg:red"
format = '[$symbol$version]($style) '

[docker_context]
symbol = " "
style = "fg:blue"
format = '[$symbol$context]($style) '

[cmd_duration]
min_time = 1_000
style = "fg:comment"
format = '[took $duration]($style) '

[time]
disabled = false
time_format = "%H:%M"
style = "fg:comment"
format = '[$time]($style)'

[line_break]
disabled = false

[character]
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:purple)'

[palettes.tokyonight]
red = "#f7768e"
orange = "#ff9e64"
yellow = "#e0af68"
green = "#9ece6a"
cyan = "#7dcfff"
blue = "#7aa2f7"
purple = "#bb9af7"
magenta = "#c678dd"
white = "#c0caf5"
foreground = "#a9b1d6"
comment = "#565f89"
bg_dark = "#1a1b26"
bg = "#24283b"
bg_highlight = "#292e42"
