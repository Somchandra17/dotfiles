# Lean Kitty. Look matches the Fedora plan: Fantasque Sans Mono 14, opacity 0.9, OneDark.
# Theme file is the OneDark.conf from the old Hyprland backup. The rest of that
# kitty-themes tree is not copied.

include OneDark.conf

font_family Fantasque Sans Mono
font_size 14.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.9
dynamic_background_opacity yes
confirm_os_window_close 0

cursor_trail 1
cursor_shape beam

linux_display_server wayland

scrollback_lines 10000
wheel_scroll_min_lines 1
window_padding_width 4

enable_audio_bell no
remember_window_size yes
hide_window_decorations yes

# Directional splits only apply in the splits layout.
enabled_layouts splits
map ctrl+shift+d launch --location=vsplit --cwd=current
map ctrl+shift+e launch --location=hsplit --cwd=current
