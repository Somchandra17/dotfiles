# Lean Kitty. Fantasque Sans Mono at 14, opacity 0.9, OneDark.
# Nerd Font is used only for icons, so the letters stay the normal face.
# Theme file is the OneDark.conf from the old Hyprland backup. The rest of that
# kitty-themes tree is not copied.

include OneDark.conf

font_family Fantasque Sans Mono
bold_font Fantasque Sans Mono
italic_font Fantasque Sans Mono
bold_italic_font Fantasque Sans Mono
font_size 14.0
symbol_map U+e000-U+e00a,U+e0a0-U+e0c8,U+e0ca-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ed00-U+efce,U+f000-U+f2e0,U+f300-U+f372,U+f400-U+fd46,U+f0001-U+f1af0 FantasqueSansM Nerd Font Mono

# Pure black. Opacity stays, so the wallpaper still shows through.
background #000000
background_opacity 0.9
dynamic_background_opacity yes
confirm_os_window_close 0

cursor_trail 1
cursor_shape beam

linux_display_server wayland

scrollback_lines 10000
wheel_scroll_min_lines 1
window_padding_width 4

enable_audio_bell no
remember_window_size yes
hide_window_decorations yes

# Directional splits only apply in the splits layout.
enabled_layouts splits
map ctrl+shift+d launch --location=vsplit --cwd=current
map ctrl+shift+e launch --location=hsplit --cwd=current

# Move focus between those splits.
map ctrl+shift+left neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up neighboring_window up
map ctrl+shift+down neighboring_window down
